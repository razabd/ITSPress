# =============================================================================
# Konfigurasi Nginx TAHAP 1 (HTTP saja) — dipakai sebelum sertifikat SSL terbit
# Ganti "yourdomain.com" dengan domain Anda.
# Setelah certbot berhasil, ganti file aktif ke itspress.conf (lihat panduan).
# =============================================================================

server {
    listen 80;
    server_name yourdomain.com;

    # Webroot untuk verifikasi ACME (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Sementara: layani aplikasi lewat HTTP agar bisa dites sebelum SSL
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200M;
    }

    location /lsd/ {
        proxy_pass http://lsdserver:8990/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
