# =============================================================================
# Working Config (reference — used in WSL running as root)
# =============================================================================


# LCP Server

profile: "basic"
lcp:
    # the port on which the License Server will be running
    port: 8989
    # replace this dsn if you're not using SQLite
    database: "sqlite3://file:/root/readium-lcp-server/db/lcp.sqlite?cache=shared&mode=rwc"
    # authentication file of the License Server. Here we use the same file for the License Server and Status Server
    auth_file: "/root/readium-lcp-server/config/htpasswd"
# uncomment if lcpencrypt does not manage the storage of encrypted publications
storage:
    filesystem:
        directory: "/root/readium-lcp-server/files/storage"
certificate:
    # theses test certificates are provided in the test/cert folder of the codebase
    cert: "/root/readium-lcp-server/config/cert-edrlab-test.pem"
    private_key: "/root/readium-lcp-server/config/privkey-edrlab-test.pem"
license:
    links:
        hint: "http://localhost:8081/api/v1/lcp-hint"
        publication: "http://localhost:8081/api/v1/content/{publication_id}"
        # status link: Thorium Reader uses this to check license status from LSD server
        status: "http://localhost:8990/licenses/{license_id}/status"


# LSD Server

lsd:
    # the port on which the Status Server will be running
    port: 8990
    # URL used by the LCP server to notify the LSD server of new licenses (internal, same machine)
    public_base_url: "http://localhost:8990"
    # replace this dsn if you're not using SQLite
    database: "sqlite3:///root/readium-lcp-server/db/lsd.sqlite?cache=shared&mode=rwc"
    # authentication file of the Status Server. Here we use the same file for the License Server and Status Server
    auth_file: "/root/readium-lcp-server/config/htpasswd"
    # Keep {license_id} as-is; this is a template.
    license_link_url: "http://localhost:8990/{license_id}"
license_status:
    register: true
    # uncomment the lines below if you're allowing e-lending
    #renew: true
    #return: true
    #renting_days: 60
    #renew_days: 7
# Credentials used by the LCP server to notify the LSD server (must match an entry in lsd.auth_file / htpasswd)
lsd_notify_auth:
    username: "readium"
    password: "readium"